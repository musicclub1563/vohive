name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_TAGS: with_utls nomsgpack

jobs:
  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Lint
        run: npm run lint --prefix web

      - name: Typecheck
        run: npm run typecheck --prefix web

      - name: Unit tests
        run: npm test --prefix web

      - name: Build
        run: npm run build --prefix web

      - name: Upload embedded web UI
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Go vet, test and build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与本地工具链（go1.27.x）保持一致，避免 gofmt 跨版本格式差异导致 CI 误判
          go-version: '1.27'
          cache: true

      - name: Download Go modules
        run: go mod download

      # internal/web/fs.go embeds internal/web/dist with //go:embed, so the
      # package cannot compile until the frontend assets are in place.
      - name: Download embedded web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Sync frontend dist for embed
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web
          cp -R web/dist internal/web/dist

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^third_party/'))"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet -tags "$GO_TAGS" ./...

      - name: Test
        run: go test -tags "$GO_TAGS" -race ./...

      - name: Build (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -buildvcs=false -tags "$GO_TAGS" -o dist/vohive ./cmd/vohive
