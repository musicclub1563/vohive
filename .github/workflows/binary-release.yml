name: Build Release Binaries

# 与 VoCat 发布配方对齐:
#   - 资产命名为 <name>-linux-<arch>(无版本号),支持 amd64/arm64/armv7
#   - 注:aarch64 与 arm64 为同一架构(GOARCH=arm64),仅保留 arm64 一种发行物
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Build frontend assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  test:
    name: Go test
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download embedded web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Sync frontend dist for embed
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web
          cp -R web/dist internal/web/dist

      # 跳过依赖真实调制解调器 / 外部推送凭据 / 特定时序的集成测试包,
      # 与 ci.yml 保持一致。
      - name: Test
        run: go test -tags "with_utls nomsgpack" $(go list ./... | grep -v -E '/(internal/(device|esim|notify))$')

  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [web, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goarch: amd64
            goarm: ""
            filename: vohive-linux-amd64
          - target: linux-arm64
            goarch: arm64
            goarm: ""
            filename: vohive-linux-arm64
          - target: linux-armv7
            goarch: arm
            goarm: "7"
            filename: vohive-linux-armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download embedded web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Sync frontend dist for embed
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web
          cp -R web/dist internal/web/dist

      - name: Build ${{ matrix.target }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          OUTPUT: dist/${{ matrix.filename }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="${VERSION#v}"
          BUILD_TIME="$(git show -s --format=%cI HEAD)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/1239t/vohive/internal/global.Version=${VERSION} -X github.com/1239t/vohive/internal/global.BuildTime=${BUILD_TIME}" \
            -o "$OUTPUT" \
            ./cmd/vohive
          chmod 0755 "$OUTPUT"
          # 静态链接校验:CGO_ENABLED=0 不应出现动态加载器需求
          if readelf -l "$OUTPUT" | grep -q 'Requesting program interpreter'; then
            echo "ERROR: $OUTPUT unexpectedly requires a dynamic loader" >&2
            readelf -l "$OUTPUT" >&2
            exit 1
          fi

      # 打包为最终发行物:内含二进制、示例配置、systemd 单元与一键安装脚本。
      - name: Assemble ${{ matrix.target }} package (tar.xz)
        env:
          PKGNAME: ${{ matrix.filename }}
          OUTPUT: dist/${{ matrix.filename }}
        run: |
          set -euo pipefail
          PKGDIR="pkg/${PKGNAME}"
          mkdir -p "$PKGDIR"
          cp "$OUTPUT"                         "$PKGDIR/vohive"
          cp config/config.example.yaml        "$PKGDIR/config.example.yaml"
          cp packaging/systemd/vohive.service  "$PKGDIR/vohive.service"
          cp scripts/install.sh                "$PKGDIR/install.sh"
          chmod 0755 "$PKGDIR/vohive" "$PKGDIR/install.sh"
          tar -cJf "dist/${PKGNAME}.tar.xz" -C pkg "$PKGNAME"
          ls -lh "dist/${PKGNAME}.tar.xz"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ matrix.filename }}.tar.xz
          if-no-files-found: error
          retention-days: 1

  github-release:
    if: github.ref_type == 'tag'
    needs: binaries
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum vohive-linux-* | sort > SHA256SUMS

      - name: Create or update GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
