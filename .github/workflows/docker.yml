name: docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the built image to GHCR'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  smoke:
    name: Smoke test ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.platform }} smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: vohive-smoke:${{ matrix.arch }}
          build-args: |
            VERSION=0.0.0-smoke
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha

      # 入口脚本应在配置缺失时从 config.example.yaml 播种 config.yaml，
      # 且镜像需包含网络/调制解调器排障工具。
      - name: Verify runtime tooling
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            --entrypoint /bin/sh vohive-smoke:${{ matrix.arch }} -c '
              set -eu
              command -v ip
              command -v lsusb
              test -f /app/config/config.example.yaml
              test -x /app/vohive
            '

      - name: Verify entrypoint seeds config on first start
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            -e CONFIG_PATH=/tmp/vohive-smoke/config.yaml \
            --entrypoint /bin/sh vohive-smoke:${{ matrix.arch }} -c '
              set -eu
              /usr/local/bin/vohive-entrypoint -h >/dev/null 2>&1 || true
              test -s /tmp/vohive-smoke/config.yaml
            '

  build-and-push:
    name: Build and push multi-arch image
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository name for ghcr.io
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Derive version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
